# AgenticIterRag v1 local 8-GPU resource profile.
#
# This file describes hardware plus stage-level placement. Do not put global
# role bindings such as resource.agent/resource.recall here; AIR pipelines may
# execute different stage subsets, so placement must be scoped by stage.

name: local_8gpu_0_7

hardware:
  accelerator: auto
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]

defaults:
  wait_for_gpus:
    enable: true
    ids: null
    interval_seconds: 300
    label: AgenticIterRag v1 GPU wait

stage_resources:
  train_agent:
    note: train_agent may run different implementations; SPAD-RAG resources are scoped by internal sub-stage.
    trainer:
      gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    impls:
      spad_rag:
        sub_stages:
          search_policy_rl:
            trainer:
              gpu_ids: [0, 1, 2, 3]
              n_gpus_per_node: 4
              tensor_parallel_size: 1
            services:
              teacher_answerer:
                profile: glm47_single_vllm
                gpu_ids: [4, 5]
                tensor_parallel_size: 2
                port: 8067
                endpoint: http://127.0.0.1:8067/v1/chat/completions
                served_model_name: GLM-4.7-Flash
                auto_start: true
                auto_stop: true
                preflight: true
                wait_seconds: 600
              recall:
                backend_type: npu
                instance_count: 2
                port: 8130
                backend_base_port: 8131
                retrieval_service_url: http://127.0.0.1:8130/retrieve
                auto_start: true
                auto_stop: true
                wait_seconds: 360
                proxy:
                  strategy: least_inflight
                  timeout: 180
                  failure_cooldown_seconds: 10
                  latency_ewma_alpha: 0.2
                  max_retries_per_request: 2
                accelerator_backend:
                  gpu_ids: [6, 7]
                  query_batch_size: 32
                  doc_dtype: float16

          answer_refresh_data:
            services:
              actor_vllm:
                common:
                  auto_start: true
                  auto_stop: true
                  wait_seconds: 600
                  gpu_memory_utilization: 0.80
                  max_model_len: 13024
                  max_num_seqs: 32
                  max_num_batched_tokens: 32768
                  enable_prefix_caching: true
                  enable_chunked_prefill: true
                  enforce_eager: false
                  tensor_parallel_size: 1
                replicas:
                  - name: spad-refresh-actor-0
                    gpu_ids: [0]
                    port: 8340
                    served_model_name: spad-refresh-actor-0
                  - name: spad-refresh-actor-1
                    gpu_ids: [1]
                    port: 8341
                    served_model_name: spad-refresh-actor-1
                  - name: spad-refresh-actor-2
                    gpu_ids: [2]
                    port: 8342
                    served_model_name: spad-refresh-actor-2
                  - name: spad-refresh-actor-3
                    gpu_ids: [3]
                    port: 8343
                    served_model_name: spad-refresh-actor-3
                  - name: spad-refresh-actor-4
                    gpu_ids: [4]
                    port: 8344
                    served_model_name: spad-refresh-actor-4
                  - name: spad-refresh-actor-5
                    gpu_ids: [5]
                    port: 8345
                    served_model_name: spad-refresh-actor-5
              teacher_answerer:
                profile: glm47_single_vllm
                common:
                  tensor_parallel_size: 2
                  served_model_name: GLM-4.7-Flash
                  auto_start: true
                  auto_stop: true
                  preflight: true
                  wait_seconds: 600
                  max_num_seqs: 128
                  max_num_batched_tokens: 65536
                  enable_prefix_caching: true
                  enable_chunked_prefill: true
                  enforce_eager: false
                replicas:
                  - name: spad_glm47_vllm_8067
                    container_name: spad_glm47_vllm_8067
                    gpu_ids: [0, 1]
                    port: 8067
                    endpoint: http://127.0.0.1:8067/v1/chat/completions
                  - name: spad_glm47_vllm_8068
                    container_name: spad_glm47_vllm_8068
                    gpu_ids: [2, 3]
                    port: 8068
                    endpoint: http://127.0.0.1:8068/v1/chat/completions
                  - name: spad_glm47_vllm_8069
                    container_name: spad_glm47_vllm_8069
                    gpu_ids: [4, 5]
                    port: 8069
                    endpoint: http://127.0.0.1:8069/v1/chat/completions
                  - name: spad_glm47_vllm_8070
                    container_name: spad_glm47_vllm_8070
                    gpu_ids: [6, 7]
                    port: 8070
                    endpoint: http://127.0.0.1:8070/v1/chat/completions
              recall:
                backend_type: npu
                instance_count: 2
                port: 8130
                backend_base_port: 8131
                retrieval_service_url: http://127.0.0.1:8130/retrieve
                auto_start: true
                auto_stop: true
                wait_seconds: 360
                proxy:
                  strategy: least_inflight
                  timeout: 180
                  failure_cooldown_seconds: 10
                  latency_ewma_alpha: 0.2
                  max_retries_per_request: 2
                accelerator_backend:
                  gpu_ids: [6, 7]
                  query_batch_size: 32
                  doc_dtype: float16

          answer_distillation:
            phases:
              grpo:
                trainer:
                  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
                  n_gpus_per_node: 8
                  tensor_parallel_size: 1
              sft:
                trainer:
                  gpu_ids: [0]
                  n_gpus_per_node: 1
              dpo:
                trainer:
                  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
                  n_gpus_per_node: 8
                  tensor_parallel_size: 1

  generate_traces:
    services:
      agent_vllm:
        # Qwen3-4B has 32 attention heads, so TP must divide 32.
        # With retriever backends on 6/7, TP=4 is the valid local placement.
        gpu_ids: [0, 1, 2, 3]
        tensor_parallel_size: 4
        port: 8140
        served_model_name: agentic-iter-rag-agent
        auto_start: true
        auto_stop: true

      recall:
        # recall backend 类型：cpu / npu / cuda。
        # CPU 模式不读取 accelerator_backend，也不会占用 NPU/GPU。
        backend_type: cpu

        # CPU retriever 默认启动 8 个 backend 实例，统一挂到下面的 proxy 端口。
        instance_count: 8

        port: 8130
        backend_base_port: 8131
        retrieval_service_url: http://127.0.0.1:8130/retrieve
        auto_start: true
        auto_stop: true
        wait_seconds: 360
        proxy:
          # 所有 backend_type 都使用 least-inflight 负载均衡。
          strategy: least_inflight
          timeout: 180
          failure_cooldown_seconds: 10
          latency_ewma_alpha: 0.2
          max_retries_per_request: 8
        cpu_backend:
          # 只有 backend_type=cpu 时读取；当前机器 192 核，8*16=128 线程，约 66.7%，低于 70% 阈值。
          cpu_threads_per_instance: 16
          query_batch_size: 8
          doc_dtype: float32
        accelerator_backend:
          # 只有 backend_type=npu/cuda 时读取；保留 6-7 作为显式切换模板。
          gpu_ids: [6, 7]
          query_batch_size: 32
          doc_dtype: float16
        # 是否启动前跑 index/corpus 离线资产 verifier；默认关闭，避免多实例重复扫描大文件。
        asset_precheck: false
        # 是否服务 ready 后发真实 retrieval 预检 query；默认关闭，只用 /gpu_status 和 /health 判断服务可用。
        query_preflight: false
        # 仅当 query_preflight=true 时使用。
        preflight_query: who got the first nobel prize in physics?
        preflight_expect: null

      dense_reranker:
        gpu_ids: []
        auto_start: false
        auto_stop: false

      llm_judge:
        gpu_ids: []
        endpoint: http://127.0.0.1:8067/v1/chat/completions
        model: DeepSeek-V4-Flash
        auto_start: false
        auto_stop: false
        preflight: false
        wait_seconds: 240

  build_reranker_dataset:
    local_cpu:
      workers: 1

  build_reranker_branch_dataset:
    local_cpu:
      workers: 1

  filter_reranker_branch_dataset:
    local_cpu:
      workers: 1

  train_llm_reranker:
    # train_llm_reranker 内部有 stage1/stage2 两个 phase，这些服务不会同时全部启动。
    # 资源按 phase_services 分层，避免 stage1/stage2 的 actor、frozen agent、retriever 混在同一层看不清。
    allow_gpu_overlap: true

    phase_services:
      stage1_format:
        # stage1 只训练 reranker 格式和长度，不启动 frozen agent/retriever，因此 8 张卡都给 reranker。
        services:
          reranker_actor:
            gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
            # Qwen3-4B rollout 不适合 TP8 单副本；TP1 会在 8 张卡上形成 8 个 rollout replica，提高请求并发和 NPU 利用率。
            tensor_parallel_size: 1
            port: 8241

      stage2_agentic:
        # stage2 会把 reranker 输出接回 frozen agent 继续 rollout，所以需要同时启动三类服务。
        services:
          reranker_actor:
            # stage2 需要给 frozen agent 和 retriever 留卡，所以 reranker actor 使用 0-3。
            gpu_ids: [0, 1, 2, 3]
            tensor_parallel_size: 4
            port: 8242

          frozen_agent_vllm:
            # stage2 专用 frozen search agent，默认使用 4 张 NPU；CPU retriever 不再占用 6-7。
            gpu_ids: [4, 5, 6, 7]
            tensor_parallel_size: 4
            port: 8140
            served_model_name: agentic-iter-rag-frozen-agent
            auto_start: true
            auto_stop: true

          recall:
            # stage2 专用 retriever 默认使用 CPU backend，避免和 reranker/frozen agent 抢 NPU。
            backend_type: cpu
            instance_count: 8
            port: 8130
            backend_base_port: 8131
            retrieval_service_url: http://127.0.0.1:8130/retrieve
            auto_start: true
            auto_stop: true
            wait_seconds: 360
            proxy:
              # CPU/NPU/CUDA retriever 都统一走 least-inflight proxy。
              strategy: least_inflight
              timeout: 180
              failure_cooldown_seconds: 10
              latency_ewma_alpha: 0.2
              max_retries_per_request: 8
            cpu_backend:
              # 只有 backend_type=cpu 时读取；当前机器 192 核，8*16=128 线程，约 66.7%，低于 70% 阈值。
              cpu_threads_per_instance: 16
              query_batch_size: 8
              doc_dtype: float32
            accelerator_backend:
              # 只有 backend_type=npu/cuda 时读取；CPU 默认模式下不会生效。
              gpu_ids: [6, 7]
              query_batch_size: 32
              doc_dtype: float16
            # 是否启动前跑 index/corpus 离线资产 verifier；LLM reranker 训练默认关闭。
            asset_precheck: false
            # 是否服务 ready 后发真实 retrieval 预检 query；默认关闭，减少训练启动耗时。
            query_preflight: false
            # 仅当 query_preflight=true 时使用。
            preflight_query: who got the first nobel prize in physics?

  build_service_bundle:
    local_cpu:
      workers: 1

  infer_matrix:
    # Baselines are planned as sequential service groups; repeated GPU ids are intentional here.
    allow_gpu_overlap: true
    services:
      origin_agent_vllm:
        gpu_ids: [0, 1, 2, 3]
        tensor_parallel_size: 4
        port: 8141
        served_model_name: air-origin-agent
        auto_start: true
        auto_stop: true

      trained_agent_vllm:
        gpu_ids: [0, 1, 2, 3]
        tensor_parallel_size: 4
        port: 8140
        served_model_name: agentic-iter-rag-agent
        auto_start: true
        auto_stop: true

      recall:
        gpu_ids: [5]
        port: 8130
        retrieval_service_url: http://127.0.0.1:8130/retrieve
        auto_start: true
        auto_stop: true
        wait_seconds: 240

      original_llm_reranker:
        gpu_ids: [6, 7]
        endpoint: http://127.0.0.1:8167/v1/chat/completions
        model: DeepSeek-V4-Flash
        auto_start: false
        auto_stop: false

      trained_llm_reranker:
        gpu_ids: [6, 7]
        endpoint: http://127.0.0.1:8177/v1/chat/completions
        model: null
        model_path: null
        auto_start: false
        auto_stop: false
