# SPAD-RAG Qwen3-1.7B + GLM4.7 Stage 1 real VERL 5-step effect ablation overlay.

main_run:
  project:
    experiment_name: agentic_iter_rag_v1_spad_qwen3_1_7b_glm47_stage1_5step
  config_groups:
    pipeline: offline_two_stage
    agent_training: spad_rag_base
    model: qwen3_1_7b
    rollout: air_async_qwen3_1_7b

pipeline:
  resume_from_stage: train_agent
  stop_after_stage: train_agent
  skip_stages: []
  force_rerun_stages: [train_agent]
  stage_configs:
    train_agent:
      enabled: true
      impl: spad_rag
      impl_config_ref: agent_training

agent_training:
  default_backend: smoke
  resume_from_sub_stage: search_policy_rl
  stop_after_sub_stage: search_policy_rl
  skip_sub_stages: []
  force_rerun_sub_stages: [search_policy_rl]
  teacher_answerer:
    default_service_profile: glm47_single_vllm
  sub_stages:
    search_policy_rl:
      enabled: true
      backend: verl
      trainer:
        total_epochs: 1
        total_training_steps: 5
        train_batch_size: 8
        ppo_mini_batch_size: 8
        actor_micro_batch_size_per_gpu: 1
        log_prob_micro_batch_size_per_gpu: 1
        n_samples_per_prompt: 2
        train_max_samples: 40
        val_max_samples: 4
        val_batch_size: 4
        save_freq: 5
        test_freq: -1
        agent_loop_num_workers: 4
        teacher_batch_workers: 4
        rollout_gpu_memory_utilization: 0.55
        max_num_seqs: 8
        max_prompt_length: 12000
        max_response_length: 1536
        rollout_max_model_len: 13536
        max_num_batched_tokens: 13536
        use_torch_compile: false
        auto_stop_services: true
        ray_num_cpus: 24
        rollout_progress_interval: 30
        timeout_seconds: 21600
        logger: ["console"]
      rollout:
        max_assistant_turns: 3
        max_user_turns: 3
        max_tool_response_length: 1536
    answer_refresh_data:
      enabled: false
    answer_distillation:
      enabled: false
