        total_training_steps: 8
        train_max_samples: 512
        save_freq: 8
        data_seed: 42
    answer_refresh_data:
      inputs:
        max_samples: 512
    answer_distillation:
      phases:
        grpo:
          experiment_name: spad_newdata_512_stage3_grpo
          data_seed: 42

